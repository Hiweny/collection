name: Build Android APK

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk snowline-${{ github.ref_name }}.apk

      - name: Publish to Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          name: 雪线之上 Android ${{ github.ref_name }}
          body: |
            雪线之上 · 原生 Android 版
            - 原生直连 360 图床 / pone.rs，无浏览器跨域限制
            - 与网页版导入导出完全互通（snowline-images.txt）
            安装：下载 APK 后在手机上打开安装（需允许“安装未知来源应用”）。
          files: android/snowline-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact (dispatch builds)
        uses: actions/upload-artifact@v4
        with:
          name: snowline-apk
          path: android/snowline-*.apk
