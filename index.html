html,body,#root{min-height:100vh;margin:0}
body{background:radial-gradient(circle at 8% 4%,rgba(98,144,155,.65),transparent 34rem),radial-gradient(circle at 88% 12%,rgba(199,132,68,.28),transparent 26rem),linear-gradient(145deg,#1b1f29,#2C303B 52%,#121722)!important;color:#F6F1E8!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Microsoft YaHei',sans-serif}
.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:22px 0 54px}

.card,.top,.item{border:1px solid rgba(255,255,255,.12);background:rgba(246,241,232,.06);box-shadow:0 8px 32px rgba(0,0,0,.18),0 0 0 1px rgba(255,255,255,.04) inset,0 1px 0 rgba(255,255,255,.08) inset;position:relative}
.card:before,.top:before,.item:before{content:'';position:absolute;inset:0;border-radius:inherit;border:1px solid transparent;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 40%,transparent 60%,rgba(255,255,255,.06)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:2}
.glass-hover:after,.item:after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.12),transparent 60%);opacity:0;transition:opacity .4s ease;pointer-events:none;z-index:1}
.glass-hover:hover:after,.item:hover:after{opacity:1}
.card{backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%)}
.top{backdrop-filter:blur(18px) saturate(120%);-webkit-backdrop-filter:blur(18px) saturate(120%)}
.item{background:linear-gradient(145deg,rgba(246,241,232,.09),rgba(44,48,59,.28))}

.top{position:sticky;top:12px;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:999px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{width:42px;height:42px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,var(--snow) 0 31%,var(--sky) 31% 67%,var(--amber) 67%);overflow:hidden}
.brand b{display:block;letter-spacing:.08em}
.brand span{display:block;color:var(--muted);font-size:12px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill,.btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:var(--snow);border-radius:999px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;transition:all .2s}
.pill:hover,.pill.active,.btn.primary{border-color:rgba(199,132,68,.55);background:rgba(199,132,68,.25)}
.pill:disabled{opacity:.5;cursor:default}
.music-btn{padding:10px;width:40px;height:40px}
.danger{color:#ffd7d7}
.hero{display:grid;grid-template-columns:1fr .8fr;gap:18px;margin:48px 0 22px}
.card{border-radius:28px}
.hero-main{padding:clamp(24px,5vw,54px)}
.eyebrow{display:inline-flex;border:1px solid rgba(98,144,155,.42);background:rgba(98,144,155,.18);border-radius:999px;padding:8px 12px;color:var(--muted);font-size:13px;letter-spacing:.08em}
h1{margin:18px 0;font-size:clamp(42px,8vw,78px);line-height:.95;letter-spacing:-.075em}
.hero p,.hint{color:var(--muted);line-height:1.8}
.side{padding:22px;display:grid;gap:12px}
.side div{border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(255,255,255,.04);padding:16px}
.side strong{display:block;font-size:32px}
.side span{color:var(--muted);font-size:13px}

.parser{position:relative;padding:22px;margin:18px 0 22px;border-radius:30px;border:1px solid rgba(255,255,255,.12);background:rgba(246,241,232,.08);backdrop-filter:blur(24px) saturate(130%);-webkit-backdrop-filter:blur(24px) saturate(130%);box-shadow:0 12px 48px rgba(0,0,0,.22),0 0 0 1px rgba(255,255,255,.04) inset,0 1px 0 rgba(255,255,255,.08) inset}
.parser h2{position:relative;font-size:20px;letter-spacing:.03em;z-index:3;margin:0 0 12px}
textarea,.input,select{width:100%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:var(--snow);padding:13px 14px;border-radius:16px;outline:none;font-size:14px;font-family:inherit}
select option{background:var(--blue)}
textarea{min-height:92px;resize:vertical}
.parser-row{display:grid;grid-template-columns:1fr auto auto;margin-top:10px;position:relative;z-index:3;gap:8px}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:22px 0;align-items:center}
.toolbar-btns{display:flex;gap:8px;flex-wrap:wrap}
.file input{display:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.item{border-radius:24px;overflow:hidden;transition:transform .3s ease,box-shadow .3s ease}
.item:hover{transform:translateY(-2px);box-shadow:0 16px 48px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.06) inset,0 1px 0 rgba(255,255,255,.1) inset}
.media{background:linear-gradient(145deg,rgba(98,144,155,.3),rgba(171,151,126,.12));display:grid;place-items:center;overflow:hidden;position:relative;min-height:180px}
.media img,.media video{width:100%;height:auto;max-height:none;display:block}
.media img{object-fit:contain}
.body{padding:15px;position:relative;z-index:1}
.meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.tag{border:1px solid rgba(98,144,155,.4);background:rgba(98,144,155,.2);border-radius:999px;padding:5px 9px;font-size:12px}
.type{color:var(--oat);font-size:12px}
.title{font-weight:850;line-height:1.4;margin:0 0 9px;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.links{display:flex;gap:8px;flex-wrap:wrap}
.small{padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);font-size:12px;text-decoration:none;cursor:pointer;color:var(--snow);display:inline-flex;align-items:center;gap:4px}
.small:hover{background:rgba(255,255,255,.12)}
.empty{padding:42px;text-align:center;color:var(--muted)}
.foot{text-align:center;color:rgba(246,241,232,.48);font-size:13px;margin-top:34px}

/* Gallery */
.gallery{position:relative;width:100%;padding:12px}
.gallery .page{position:relative;z-index:3;width:100%;height:auto;object-fit:contain;border-radius:18px;box-shadow:0 18px 45px rgba(0,0,0,.35);animation:pageIn .28s ease}
.stack{position:absolute;inset:20px 14px 8px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.s1{z-index:2;transform:rotate(3deg) translate(5px,4px)}
.s2{z-index:1;transform:rotate(-4deg) translate(-5px,10px);opacity:.72}
.flip{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:34px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(44,48,59,.5);color:var(--snow);font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.flip:hover{background:rgba(199,132,68,.42)}
.prev{left:18px}.next{right:18px}
.count{position:absolute;z-index:4;right:18px;bottom:16px;padding:6px 10px;border-radius:999px;background:rgba(44,48,59,.5);border:1px solid rgba(255,255,255,.12);font-size:12px;color:var(--snow)}
.single-del{position:absolute;z-index:4;left:18px;bottom:16px;width:28px;height:28px;border-radius:50%;background:rgba(220,80,80,.6);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.single-del:hover{background:rgba(220,80,80,.85)}
@keyframes pageIn{from{opacity:.45;transform:translateX(18px) rotate(1deg) scale(.98)}to{opacity:1;transform:none}}

/* Daily Banner */
.daily{position:relative;margin:44px 0 18px;border-radius:34px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,.3);background:linear-gradient(145deg,rgba(98,144,155,.16),rgba(44,48,59,.38));min-height:340px;display:flex;flex-direction:column}
.daily-img-wrap{flex:1;display:grid;place-items:center;overflow:hidden;min-height:260px;background:rgba(18,23,34,.3)}
.daily-img{max-width:100%;max-height:520px;width:auto;height:auto;object-fit:contain;border-radius:18px;opacity:0;transition:opacity .6s ease;box-shadow:0 12px 36px rgba(0,0,0,.3)}
.daily-img.ready{opacity:1}
.daily-placeholder{color:rgba(246,241,232,.4);font-size:15px;text-align:center;padding:60px 20px}
.daily-shade-bottom{padding:clamp(20px,4vw,40px);text-align:left;background:linear-gradient(180deg,transparent,rgba(18,23,34,.82));flex-shrink:0}
.daily-shade-bottom h1{max-width:900px;margin:12px 0 0;font-size:clamp(26px,4.5vw,48px);letter-spacing:-.04em;line-height:1.1;text-wrap:balance}
.daily-shade-bottom .eyebrow{font-size:12px;padding:6px 10px}
.hero-bottom{margin:34px 0 0}
.hero-bottom .hero-main p{display:none}

/* Image Bed Tool */
.imgbed-tabs{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px;margin-bottom:10px}
.imgbed-tabs .pill{text-align:center;justify-content:center}
.imgbed-dropzone{display:flex;align-items:center;justify-content:center;min-height:120px;border:2px dashed rgba(255,255,255,.2);border-radius:18px;background:rgba(255,255,255,.04);cursor:pointer;transition:all .2s}
.imgbed-dropzone:hover{border-color:rgba(199,132,68,.5);background:rgba(199,132,68,.08)}
.imgbed-result{margin-top:14px;padding:14px;border-radius:18px;background:rgba(98,144,155,.1);border:1px solid rgba(98,144,155,.25)}
.imgbed-result p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.imgbed-link-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}

/* 选择性转存弹窗 */
.modal-overlay{position:fixed;inset:0;z-index:99998;background:rgba(18,23,34,.78);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{width:min(680px,100%);max-height:88vh;display:flex;flex-direction:column;background:linear-gradient(145deg,rgba(44,48,59,.96),rgba(27,31,41,.96));border:1px solid rgba(255,255,255,.15);border-radius:24px;box-shadow:0 24px 72px rgba(0,0,0,.5);overflow:hidden;animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.modal-header h3{margin:0;font-size:18px}
.modal-close{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:rgba(255,255,255,.1);color:var(--snow)}
.modal-sub{padding:10px 20px 0;margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.modal-actions-top{display:flex;align-items:center;gap:10px;padding:10px 20px}
.small-pill{padding:6px 12px;font-size:12px}
.modal-count{margin-left:auto;font-size:13px;color:var(--muted)}
.modal-grid{flex:1;overflow-y:auto;padding:8px 20px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.modal-thumb{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .2s;background:rgba(255,255,255,.06)}
.modal-thumb.checked{border-color:var(--amber)}
.modal-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.modal-thumb:hover img{transform:scale(1.05)}
.modal-thumb img{transition:transform .3s}
.thumb-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.thumb-check{position:absolute;top:6px;right:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--amber);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.check-empty{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.3)}
.thumb-idx{position:absolute;bottom:6px;left:6px;padding:2px 7px;border-radius:999px;background:rgba(44,48,59,.7);font-size:11px;color:var(--snow)}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)}
.note-bar{padding:8px 12px;font-size:12px;color:var(--muted);text-align:center;background:rgba(0,0,0,.2)}

/* 手机适配 */
@media(max-width:860px){
  .hero,.toolbar{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .top{border-radius:24px;align-items:flex-start;flex-wrap:wrap}
  .top-actions{flex:1;justify-content:flex-end}
  .parser-row{grid-template-columns:1fr}
  .toolbar-btns{justify-content:flex-start}
  .modal-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .hero{margin-top:32px}
  h1{font-size:48px}
  .daily{min-height:300px;margin-top:32px;border-radius:24px}
  .daily-img-wrap{min-height:220px}
  .daily-shade-bottom h1{font-size:clamp(22px,6vw,32px)}
  .top{padding:10px 12px;gap:8px}
  .logo{width:36px;height:36px}
  .brand b{font-size:14px}
  .brand span{font-size:11px}
  .pill,.btn{padding:8px 12px;font-size:13px}
  .music-btn{padding:8px;width:36px;height:36px}
  .parser{padding:16px;border-radius:24px}
  .parser h2{font-size:18px}
  .imgbed-link-row{grid-template-columns:1fr;gap:6px}
  .meta{font-size:11px}
  .title{font-size:13px}
  .links .small{padding:6px 8px;font-size:11px}
  .flip{width:30px;height:38px;font-size:24px}
  .prev{left:10px}.next{right:10px}
  .modal-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:380px){
  .top-actions{gap:6px}
  .pill,.btn{padding:7px 10px;font-size:12px}
  .modal-grid{grid-template-columns:1fr 1fr}
}

/* 回顶部按钮 */
.backtop{position:fixed;right:20px;bottom:24px;z-index:90;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(44,48,59,.72);color:#F6F1E8;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.35);opacity:0;visibility:hidden;transform:translateY(12px) scale(.85);transition:opacity .3s ease,transform .3s ease,visibility .3s ease}
.backtop.show{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.backtop:hover{background:rgba(199,132,68,.5);border-color:rgba(199,132,68,.6)}
@media(max-width:560px){.backtop{right:14px;bottom:18px;width:40px;height:40px}}
